# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[advisories]
# Deny crates with known security advisories
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Allow advisories for transitive dependencies we cannot directly update
ignore = [
    "RUSTSEC-2024-0436", # paste crate unmaintained — transitive dep via criterion/statrs
    "RUSTSEC-2025-0141", # bincode 1.3 unmaintained — transitive dep (optional serde feature); upstream migration to bincode 2.x tracked separately
    "RUSTSEC-2026-0204", # crossbeam-utils invalid pointer dereference in fmt::Pointer — transitive dep via rayon/faer; awaiting crossbeam-utils >= 0.9.20 propagation
]

[licenses]
# Reject copyleft licenses
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "OpenSSL",
    "Unlicense",
]
confidence-threshold = 0.8

[bans]
# Warn on multiple versions of the same crate
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
