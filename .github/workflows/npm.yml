name: npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        required: false
        default: true
        type: boolean

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wasm:
    name: Build WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: wasm-pack build crates/anofox-forecast-js --target web --out-dir ../../js --out-name anofox_forecast_js

      - name: Restore custom package.json and README
        run: |
          git checkout js/package.json js/README.md

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-package
          path: js/
          retention-days: 1

  test-js:
    name: Test JavaScript
    needs: build-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: js/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run JavaScript tests
        working-directory: js
        run: node --test test.mjs

  publish-npm:
    name: Publish to npm
    needs: [build-wasm, test-wasm, test-js]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-package
          path: js/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Upgrade npm for OIDC support
        run: |
          echo "Current npm version:"
          npm --version
          echo "Upgrading npm to latest (need >= 11.5.1 for OIDC)..."
          npm install -g npm@latest
          echo "New npm version:"
          npm --version
          node --version

      - name: Verify package contents
        run: |
          echo "Package contents:"
          ls -la js/
          echo ""
          echo "package.json:"
          cat js/package.json

      # OIDC-only publish. Auth comes from npm's trusted-publisher config
      # (configured for this repo + workflow on npmjs.com), tied to the
      # `id-token: write` permission above. The `--provenance` flag emits
      # the supply-chain attestation alongside the publish.
      - name: Publish to npm (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        working-directory: js
        run: npm publish --access public --dry-run

      # Derive the dist-tag from the version in js/package.json (the version
      # that npm is about to publish anyway). npm 11 requires `--tag` on
      # prerelease versions, and defaulting to `latest` on stable releases
      # keeps `npm install @sipemu/anofox-forecast` tracking the newest GA.
      # Reading from package.json works uniformly for `release:published`
      # events and `workflow_dispatch` runs.
      - name: Publish to npm
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run) }}
        working-directory: js
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in
            *-alpha*) tag=alpha ;;
            *-beta*)  tag=beta  ;;
            *-rc*)    tag=rc    ;;
            *)        tag=latest ;;
          esac
          echo "Publishing @sipemu/anofox-forecast@$version with npm dist-tag: $tag"
          npm publish --access public --provenance --tag "$tag"

  test-wasm:
    name: Test WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Run WASM tests
        run: wasm-pack test --headless --chrome crates/anofox-forecast-js
