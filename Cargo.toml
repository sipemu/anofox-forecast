[workspace]
members = [".", "crates/anofox-forecast-js"]
resolver = "2"

[package]
name = "anofox-forecast"
version = "0.4.1"
edition = "2021"
authors = ["Simon M"]
description = "Time series forecasting library - Rust port of anofox-time"
license = "MIT"
repository = "https://github.com/sipemu/anofox-forecast"
keywords = ["time-series", "forecasting", "arima", "ets", "statistics"]
categories = ["science", "mathematics"]

[features]
default = ["postprocess"]
parallel = ["rayon"]
js = ["getrandom/js"]
postprocess = ["dep:faer", "dep:anofox-regression"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dependencies]
rayon = { version = "1.10", optional = true }
chrono = { version = "0.4", features = ["serde"] }
trueno = "0.8"
statrs = "0.18"
thiserror = "2.0"
rand = "0.8"
rustfft = "6.2"
anofox-regression = { version = "0.5.0", optional = true }
faer = { version = "0.23", optional = true, default-features = false, features = ["std", "linalg"] }

[dev-dependencies]
approx = "0.5"
criterion = "0.5"
proptest = "1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "simd_benchmark"
harness = false

[[bench]]
name = "arima_benchmark"
harness = false

[[bench]]
name = "ets_benchmark"
harness = false

[[bench]]
name = "prediction_benchmark"
harness = false

[[bench]]
name = "stl_benchmark"
harness = false

[[bench]]
name = "bootstrap_benchmark"
harness = false

