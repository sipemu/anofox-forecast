[workspace]
members = [".", "crates/anofox-forecast-js"]
resolver = "2"

[package]
name = "anofox-forecast"
version = "0.6.0"
edition = "2021"
authors = ["Simon Müller"]
description = "Time series forecasting library"
license = "MIT"
repository = "https://github.com/sipemu/anofox-forecast"
keywords = ["time-series", "forecasting", "arima", "ets", "statistics"]
categories = ["science", "mathematics"]

[features]
default = ["postprocess"]
parallel = ["rayon"]
js = ["getrandom/js"]
postprocess = ["dep:faer", "dep:anofox-regression"]
forecastability = []
seasonal-detection = ["dep:fdars-core"]
serde = ["dep:serde", "dep:serde_json", "dep:bincode"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dependencies]
rayon = { version = "1.10", optional = true }
chrono = { version = "0.4", features = ["serde"] }
trueno = "0.8"
statrs = "0.18"
thiserror = "2.0"
rand = "0.8"
anofox-regression = { version = "0.5.3", optional = true }
anofox-statistics = "0.4"
lbfgs = "0.3"
fdars-core = { version = "0.9", optional = true, default-features = false }
faer = { version = "0.23", optional = true, default-features = false, features = ["std", "linalg"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
bincode = { version = "1.3", optional = true }

[dev-dependencies]
approx = "0.5"
criterion = "0.5"
proptest = "1.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"

[profile.release]
lto = "thin"
codegen-units = 1

[[bench]]
name = "simd_benchmark"
harness = false

[[bench]]
name = "arima_benchmark"
harness = false

[[bench]]
name = "ets_benchmark"
harness = false

[[bench]]
name = "prediction_benchmark"
harness = false

[[bench]]
name = "stl_benchmark"
harness = false

[[bench]]
name = "bootstrap_benchmark"
harness = false

[[bench]]
name = "ensemble_benchmark"
harness = false

[[bench]]
name = "cv_benchmark"
harness = false

[[bench]]
name = "comprehensive_benchmark"
harness = false

