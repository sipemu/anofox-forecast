[package]
name = "anofox-forecast-js"
version = "0.5.0"
edition = "2021"
authors = ["Simon M"]
description = "WebAssembly bindings for anofox-forecast time series forecasting library"
license = "MIT"
repository = "https://github.com/sipemu/anofox-forecast"
keywords = ["wasm", "time-series", "forecasting", "javascript", "typescript"]
categories = ["wasm", "web-programming"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
anofox-forecast = { path = "../..", default-features = false, features = ["js", "postprocess"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
chrono = "0.4"
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-mutable-globals"]
