<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" font-family="Consolas,monospace" font-size="13">
  <style>
    .test  { fill: #e74c3c; opacity: 0.85; }
    .label { fill: #333; font-size: 12px; }
    .title { fill: #333; font-size: 15px; font-weight: bold; }
    .axis  { fill: #666; font-size: 10px; }
    .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333"/>
    </marker>
  </defs>

  <text x="360" y="22" text-anchor="middle" class="title">Backward Anchoring: folds placed from end</text>

  <!-- Timeline -->
  <rect x="60" y="50" width="600" height="24" fill="#e8e8e8" rx="4" stroke="#ccc"/>
  <text x="60" y="45" class="axis">0</text>
  <text x="655" y="45" class="axis">n</text>

  <!-- Test blocks placed backward -->
  <rect x="540" y="50" width="120" height="24" class="test" rx="3"/>
  <text x="600" y="66" fill="white" font-size="10" text-anchor="middle">Test 5</text>

  <rect x="420" y="50" width="120" height="24" class="test" rx="3"/>
  <text x="480" y="66" fill="white" font-size="10" text-anchor="middle">Test 4</text>

  <rect x="300" y="50" width="120" height="24" class="test" rx="3"/>
  <text x="360" y="66" fill="white" font-size="10" text-anchor="middle">Test 3</text>

  <rect x="180" y="50" width="120" height="24" class="test" rx="3"/>
  <text x="240" y="66" fill="white" font-size="10" text-anchor="middle">Test 2</text>

  <rect x="60" y="50" width="120" height="24" fill="#e74c3c" rx="3" opacity="0.4"/>
  <text x="120" y="66" fill="white" font-size="10" text-anchor="middle">Test 1</text>

  <!-- Arrows showing direction -->
  <line x1="620" y1="90" x2="100" y2="90" class="arrow"/>
  <text x="360" y="108" class="label" text-anchor="middle">Step backward by horizon</text>

  <!-- Anchor indicator -->
  <line x1="660" y1="50" x2="660" y2="80" stroke="#e74c3c" stroke-width="2"/>
  <circle cx="660" cy="80" r="3" fill="#e74c3c"/>
  <text x="665" y="84" fill="#e74c3c" font-size="9">anchor</text>

  <!-- min_initial_window constraint -->
  <rect x="60" y="130" width="100" height="20" fill="#4a90d9" rx="3" opacity="0.6"/>
  <text x="110" y="144" fill="white" font-size="9" text-anchor="middle">min_train</text>
  <line x1="60" y1="155" x2="160" y2="155" stroke="#4a90d9" stroke-width="1.5"/>
  <text x="110" y="170" fill="#4a90d9" font-size="10" text-anchor="middle">If train &lt; min_initial_window</text>
  <text x="110" y="183" fill="#4a90d9" font-size="10" text-anchor="middle">→ fold is dropped</text>

  <!-- n_folds cap -->
  <text x="500" y="145" class="label" text-anchor="middle">n_folds = cap</text>
  <text x="500" y="160" class="axis" text-anchor="middle">Take at most N folds from the end</text>
  <text x="500" y="175" class="axis" text-anchor="middle">(most recent data evaluated first)</text>
</svg>
