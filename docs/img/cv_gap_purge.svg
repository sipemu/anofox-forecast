<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" font-family="Consolas,monospace" font-size="13">
  <style>
    .train { fill: #4a90d9; }
    .test  { fill: #e74c3c; }
    .gap   { fill: #f39c12; opacity: 0.5; }
    .purge { fill: #9b59b6; opacity: 0.5; }
    .label { fill: #333; font-size: 12px; }
    .title { fill: #333; font-size: 15px; font-weight: bold; }
    .axis  { fill: #666; font-size: 10px; }
    .anno  { font-size: 10px; }
  </style>

  <text x="360" y="22" text-anchor="middle" class="title">Gap and Purge (single fold detail)</text>

  <!-- Main bar background -->
  <rect x="80" y="60" width="580" height="40" fill="#e8e8e8" rx="4" stroke="#ccc"/>

  <!-- Train -->
  <rect x="80" y="60" width="250" height="40" class="train" rx="4" opacity="0.9"/>
  <text x="180" y="85" fill="white" font-size="12" text-anchor="middle">Training Data</text>

  <!-- Purge zone -->
  <rect x="330" y="60" width="50" height="40" class="purge" rx="0"/>
  <text x="355" y="85" fill="white" font-size="10" text-anchor="middle">Purge</text>

  <!-- Gap zone -->
  <rect x="380" y="60" width="60" height="40" class="gap" rx="0"/>
  <text x="410" y="85" fill="white" font-size="10" text-anchor="middle">Gap</text>

  <!-- Test -->
  <rect x="440" y="60" width="120" height="40" class="test" rx="4" opacity="0.9"/>
  <text x="500" y="85" fill="white" font-size="12" text-anchor="middle">Test</text>

  <!-- Annotations -->
  <line x1="80" y1="110" x2="330" y2="110" stroke="#4a90d9" stroke-width="2"/>
  <text x="205" y="125" class="anno" fill="#4a90d9" text-anchor="middle">train_end</text>

  <line x1="330" y1="115" x2="380" y2="115" stroke="#9b59b6" stroke-width="2"/>
  <text x="355" y="140" class="anno" fill="#9b59b6" text-anchor="middle">purge obs</text>

  <line x1="380" y1="110" x2="440" y2="110" stroke="#f39c12" stroke-width="2"/>
  <text x="410" y="155" class="anno" fill="#f39c12" text-anchor="middle">gap obs</text>

  <line x1="440" y1="110" x2="560" y2="110" stroke="#e74c3c" stroke-width="2"/>
  <text x="500" y="125" class="anno" fill="#e74c3c" text-anchor="middle">test_start</text>

  <!-- Formula -->
  <text x="360" y="185" text-anchor="middle" class="label" font-size="11">
    origin = train_end + purge  |  test_start = origin + gap  |  test_end = test_start + horizon
  </text>
</svg>
